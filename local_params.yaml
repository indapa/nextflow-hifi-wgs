# Params for running on a local workstation with the public resources
# downloaded by following "Running Locally" in README.md. Edit the two
# directories and the machine limits, then:
#
#   nextflow run main.nf -profile local,docker    -params-file local_params.yaml -entry ...
#   nextflow run main.nf -profile local,apptainer -params-file local_params.yaml -entry ...
#
# YAML has no variables, so the resources directory is repeated below --
# replace every /data/hifi-wgs-resources with your $RES directory.

# All *_output_dir params are derived from this
output_dir: /data/hifi-wgs-results

# Machine limits: no single task will request more than this
max_cpus: 32
max_memory: 128.GB

# Reference: FASTA from the Zenodo bundle (reference_index defaults to "<reference>.fai").
# The .mmi is built locally with pbmm2 index; only WGS_SINGLETON / WGS_TRIO need it.
reference: /data/hifi-wgs-resources/hifi-wdl-resources-v2.0.0/GRCh38/human_GRCh38_no_alt_analysis_set.fasta
mmi:       /data/hifi-wgs-resources/reference/human_GRCh38_no_alt_analysis_set.mmi

# DeepVariant / DeepTrio 50 Mb interval chunks (generated with Intervals/generate_bed.py)
intervals_dir: /data/hifi-wgs-resources/intervals
bed_dir:       /data/hifi-wgs-resources/intervals

# GLnexus whole-chromosome BED (generated from the .fai)
glnexus_region_bed: /data/hifi-wgs-resources/glnexus/all_contigs.bed
glnexus_bed:        /data/hifi-wgs-resources/glnexus/all_contigs.bed

# FastVEP: GENCODE v50 GFF3 + ClinVar SA file built with fastvep sa-build
fastvep_gff:    /data/hifi-wgs-resources/fastvep/gencode.v50.annotation.gff3.gz
fastvep_sa_dir: /data/hifi-wgs-resources/fastvep/SA_files

# sawfish / TRGT (Zenodo bundle)
trgt_repeats_bed: /data/hifi-wgs-resources/hifi-wdl-resources-v2.0.0/GRCh38/trgt/adotto_repeats.updated_pathogenic_repeats.hg38.bed
expected_XX_bed:  /data/hifi-wgs-resources/hifi-wdl-resources-v2.0.0/GRCh38/hificnv/expected_cn.hg38.XX.bed
expected_XY_bed:  /data/hifi-wgs-resources/hifi-wdl-resources-v2.0.0/GRCh38/hificnv/expected_cn.hg38.XY.bed
excluded_bed:     /data/hifi-wgs-resources/hifi-wdl-resources-v2.0.0/GRCh38/hificnv/cnv.excluded_regions.common_50.hg38.bed.gz
